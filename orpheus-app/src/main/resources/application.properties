quarkus.application.name=orpheus

# ADR-010: SQLite persistent across runs, not an ephemeral database. There is no official Quarkus
# extension for SQLite: driver and dialect are the ones maintained by the community.
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:${orpheus.data-dir:.}/orpheus.db
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
# Migration on request of the command (FlywayStorageInitialization), not at startup: the command first
# has to check that orpheus.data-dir is not inside the source folder.
quarkus.flyway.migrate-at-start=false
# Without these two lines Hibernate opens a connection at startup anyway (JDBC metadata and version
# check) and the SQLite driver creates an empty orpheus.db before the check of the command (verified on
# 2026-09-26). The dialect is explicit, so the metadata is not needed; Quarkus warns about the
# "unsupported properties", as expected.
quarkus.hibernate-orm.database.version-check.enabled=false
quarkus.hibernate-orm.unsupported-properties."hibernate.boot.allow_jdbc_metadata_access"=false

# Tier 2 (ADR-014): AcoustID. The "acoustid.api-key" property maps from the ACOUSTID_API_KEY environment
# variable by MicroProfile Config convention (dots and dashes to underscores, uppercase). Quarkus also
# reads the .env file of the current directory: launched from the root of the repository, the key in .env
# is active even without exporting it. For a run without Tier 2 from that directory an explicit
# -Dacoustid.api-key= is needed.
acoustid.api-key=
quarkus.rest-client.acoustid-api.url=https://api.acoustid.org

# Tier 2 (ADR-014): MusicBrainz. A generic and harmless default value (committed file), to be overridden
# with --musicbrainz-user-agent on the import command, with the MUSICBRAINZ_USER_AGENT environment
# variable, or with an external config file through QUARKUS_CONFIG_LOCATIONS (e.g.
# ~/.config/orpheus/orpheus.properties): no personal data in this committed file.
quarkus.rest-client.musicbrainz-api.url=https://musicbrainz.org
musicbrainz.user-agent=Orpheus/0.1 (contact not configured -- see --musicbrainz-user-agent)

# Placeholder names in the paths (user decision of 2026-09-28): these are the defaults, uncomment to
# change them (also from the command line, e.g. -Dorpheus.placeholders.disc=CD).
